spring.application.name=demoSprignbootST56_4
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.error.include-message=always
server.error.include-binding-errors=always

spring.web.locale=vi_VN

# ===============================
# SQL Server Datasource
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bt09;encrypt=false;trustServerCertificate=true
spring.datasource.username=root
spring.datasource.password=Khuowng205@#
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update

# ===============================
# Encoding
# ===============================
spring.messages.encoding=UTF-8
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
